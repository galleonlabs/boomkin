# PR definitions come from the trusted base; the job guard rejects fork heads
# before runner admission. Trusted PRs check their exact head SHA.
# Runner-native git avoids shared-IP action-download throttling.
name: Native Hermes compatibility
on:
  workflow_dispatch: null
  schedule:
    - cron: 23 5 * * 1
  push:
    branches:
      - main
    paths:
      - src/**
      - scripts/hermes-native-smoke.py
      - package.json
      - bun.lock
      - .github/workflows/compatibility.yml
  pull_request_target:
    paths:
      - src/**
      - scripts/hermes-native-smoke.py
      - package.json
      - bun.lock
      - .github/workflows/compatibility.yml
permissions:
  contents: read
jobs:
  native-hermes:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - dappnode
    timeout-minutes: 20
    steps:
      - name: Checkout with runner git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |-
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ ! -d .git ]]; then
            git init
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*" "$CHECKOUT_SHA"
          unset header
          git checkout --force --detach "$CHECKOUT_SHA"
          git clean -ffdx -e 'node_modules/' -e '**/node_modules/'
          git log -1 --oneline
      - run: bun install --frozen-lockfile
      - name: Install pinned upstream in an isolated temporary directory
        run: |-
          set -euo pipefail
          native_dir=$(mktemp -d "$RUNNER_TEMP/boomkin-native.XXXXXX")
          trap 'rm -rf "$native_dir"' EXIT
          git init "$native_dir/upstream"
          git -C "$native_dir/upstream" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$native_dir/upstream" fetch --depth=1 origin 2e24e06e5513fa425ccf935d2e41991cb11ff383
          git -C "$native_dir/upstream" checkout --detach FETCH_HEAD
          python3 -m venv "$native_dir/venv"
          "$native_dir/venv/bin/pip" install --disable-pip-version-check -e "$native_dir/upstream[mcp]"
          "$native_dir/venv/bin/python" scripts/hermes-native-smoke.py --hermes "$native_dir/venv/bin/hermes"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
